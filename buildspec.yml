version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - npm install -g pnpm
  pre_build:
    commands:
      - pnpm install
  build:
    commands:
      - pnpm run build
      - pnpm run generate
  post_build:
    commands:
      - echo Build completed
artifacts:
  files:
    - '**/*'
  name: my-artifact-name